[project]
name = "ferry"
version = "0.1.0"
description = "AI agent that migrates .NET Framework apps to .NET 10."
requires-python = ">=3.13"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
ferry = "ferry.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live"]
markers = ["live: calls a paid AI API; run explicitly with -m live"]
