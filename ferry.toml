# Published paid-tier rates, USD per 1M tokens.
# The Gemini free tier bills $0. The log still records this list price.
# https://ai.google.dev/gemini-api/docs/pricing

[models.flash]
provider = "gemini"
id = "gemini-3.6-flash"
input_usd_per_mtok = 0.75
output_usd_per_mtok = 3.75
supports_temperature = true

[models.lite]
provider = "gemini"
id = "gemini-3.5-flash-lite"
input_usd_per_mtok = 0.30
output_usd_per_mtok = 2.50
supports_temperature = true

[assess]
default_model = "lite"
max_input_tokens = 30000

[tools.roslyn]
command = "dotnet"
args = ["roslyn-tools/src/Ferry.RoslynTools/bin/Release/net10.0/Ferry.RoslynTools.dll", "mcp"]
